spring:
  application:
    name: parceiro-90-dias
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/parceiro90}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  ia:
    enabled: false
  hash-key: ${APP_HASH_KEY:}
  crypto-key: ${APP_CRYPTO_KEY:}
  whatsapp:
    graph-version: ${WHATSAPP_GRAPH_VERSION:v26.0}
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    max-envios-por-segundo: ${WHATSAPP_RATE_LIMIT:20}
    tentativas-maximas: ${WHATSAPP_MAX_RETRIES:3}
  alertas:
    limiar-confianca: ${APP_ALERTAS_LIMIAR_CONFIANCA:0.7}
    escalonar-rh: ${APP_ALERTAS_ESCALONAR_RH:false}
    resposta-situacao-grave: ${APP_ALERTA_GRAVE_RESPOSTA:Obrigado por compartilhar isso. Se precisar, procure sua liderança ou o RH agora.}
    max-lembretes: ${APP_ALERTAS_MAX_LEMBRETES:1}
  retencao:
    mensagens-dias: ${APP_RETENCAO_MENSAGENS_DIAS:120}
  tempo:
    fator: ${APP_TEMPO_FATOR:1}
    inicio: ${APP_TEMPO_INICIO:}
  cadencia:
    fuso: ${APP_CADENCIA_FUSO:America/Sao_Paulo}
    inicio-janela: ${APP_CADENCIA_INICIO:17:00}
    fim-janela: ${APP_CADENCIA_FIM:19:00}
    inicio-silencio: ${APP_CADENCIA_SILENCIO_INICIO:21:00}
    fim-silencio: ${APP_CADENCIA_SILENCIO_FIM:08:00}
    expira-optin-horas: ${APP_OPTIN_EXPIRA_HORAS:48}
    ponte-dias: [7, 15, 30, 45, 60, 90]
    intervalo-ms: ${APP_CADENCIA_INTERVALO_MS:60000}
    dias:
      - faixa: [1, 10]
        intervalo: 1
      - faixa: [11, 30]
        intervalo: 3
      - faixa: [31, 60]
        intervalo: 7
      - faixa: [61, 90]
        intervalo: 10
---
spring:
  config:
    activate:
      on-profile: prod
server:
  servlet:
    session:
      cookie:
        secure: true
