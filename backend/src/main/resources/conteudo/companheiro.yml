fases:
  - inicio: 1
    fim: 10
    mensagens:
      - "Oi! Como foi seu primeiro turno por aqui?"
      - "Passando para acompanhar sua chegada. O que ajudaria você hoje?"
      - "Como está sendo conhecer a rotina da equipe?"
  - inicio: 11
    fim: 30
    mensagens:
      - "Oi! Já faz alguns dias que você começou. O que está mais claro na rotina?"
      - "Como tem sido trabalhar com a equipe nesta semana?"
      - "Tem alguma tarefa em que uma orientação faria diferença?"
  - inicio: 31
    fim: 60
    mensagens:
      - "Oi! Como está a divisão das tarefas no seu turno?"
      - "O que tem funcionado bem na sua rotina até agora?"
      - "Nesta semana, qual apoio seria útil para você?"
  - inicio: 61
    fim: 90
    mensagens:
      - "Oi! Como você está se sentindo com a rotina da função?"
      - "Tem algo que gostaria de combinar com sua liderança?"
      - "O que ajudaria a tornar seu dia de trabalho melhor?"
ponte:
  - "Oi! Hoje ou nesta semana sua liderança vai conversar com você. Se quiser, pode levar suas dúvidas e combinar o que precisa."
  - "Passando para lembrar: nesta semana há uma conversa de acompanhamento com sua liderança. Que assunto você gostaria de trazer?"
