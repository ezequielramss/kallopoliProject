services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: parceiro90
      POSTGRES_USER: ${DATABASE_USER:?configure DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?configure DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:?configure DATABASE_USER in .env} -d parceiro90"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://db:5432/parceiro90
      APP_SESSION_TIMEOUT: ${APP_SESSION_TIMEOUT:-30m}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
